[package]
name = "flowlens-tauri"
version = "0.1.0"
edition = "2021"

[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flowlens-core = { path = "../../crates/flowlens-core" }
flowlens-capture = { path = "../../crates/flowlens-capture" }
flowlens-tls = { path = "../../crates/flowlens-tls" }
flowlens-replay = { path = "../../crates/flowlens-replay" }
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros"] }
chrono = "0.4"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
qrcode = { version = "0.14", features = ["image"] }
image = "0.25"
