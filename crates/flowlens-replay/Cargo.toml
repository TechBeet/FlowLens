[package]
name = "flowlens-replay"
version = "0.1.0"
edition = "2021"
description = "HTTP request replay, session comparison, and fuzzing tools for FlowLens"
license = "MIT"

[dependencies]
flowlens-core = { path = "../flowlens-core" }
flowlens-storage = { path = "../flowlens-storage" }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
thiserror = "1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
http = "1"
url = "2"
rand = "0.8"
base64 = "0.22"

[dev-dependencies]
tempdir = "0.3"