[package]
name = "flowlens-protocol"
version = "0.1.0"
edition = "2021"
description = "Protocol parsers (HTTP/1.1, WebSocket, SSE, gRPC) for FlowLens"
license = "MIT"

[dependencies]
flowlens-core = { path = "../flowlens-core" }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
thiserror = "1"
anyhow = "1"
httparse = "1"