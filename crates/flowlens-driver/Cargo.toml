[package]
name = "flowlens-driver"
version = "0.1.0"
edition = "2021"
description = "Windows kernel driver interface for FlowLens"
license = "MIT"

[dependencies]
flowlens-core = { path = "../flowlens-core" }
flowlens-capture = { path = "../flowlens-capture" }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
thiserror = "1"
anyhow = "1"
windows-sys = { version = "0.52", features = ["Win32_NetworkManagement_Ndis", "Win32_System_Services", "Win32_Foundation"] }