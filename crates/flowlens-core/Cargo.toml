[package]
name = "flowlens-core"
version = "0.1.0"
edition = "2021"
description = "Core domain models, event bus, and session state machine for FlowLens"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
tokio = { version = "1", features = ["sync", "macros", "rt", "rt-multi-thread", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"
glob = "0.3"
