[package]
name = "flowlens-cli"
version = "0.1.0"
edition = "2021"
description = "Command-line interface for FlowLens"
license = "MIT"

[dependencies]
flowlens-core = { path = "../flowlens-core" }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
windows-sys = { version = "0.52", features = ["Win32_Security", "Win32_Foundation", "Win32_System_Threading"] }