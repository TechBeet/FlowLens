[package]
name = "flowlens-attribution"
version = "0.1.0"
edition = "2021"
description = "ETW and IP Helper process attribution for FlowLens"
license = "MIT"

[dependencies]
flowlens-core = { path = "../flowlens-core" }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
thiserror = "1"
anyhow = "1"
windows-sys = { version = "0.52", features = ["Win32_Networking_WinSock", "Win32_System_Threading", "Win32_Security"] }