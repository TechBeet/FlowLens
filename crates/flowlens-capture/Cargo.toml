[package]
name = "flowlens-capture"
version = "0.1.0"
edition = "2021"
description = "Npcap capture engine and WFP filter management for FlowLens"
license = "MIT"

[dependencies]
flowlens-core = { path = "../flowlens-core" }
flowlens-attribution = { path = "../flowlens-attribution" }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
thiserror = "1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Real packet capture
pcap = "2"
chrono = { version = "0.4", features = ["serde"] }