[package]
name = "flowlens-service"
version = "0.1.0"
edition = "2021"
description = "Windows service entry point and IPC server for FlowLens"
license = "MIT"

[dependencies]
flowlens-core = { path = "../flowlens-core" }
flowlens-capture = { path = "../flowlens-capture" }
flowlens-mcp = { path = "../flowlens-mcp" }
flowlens-storage = { path = "../flowlens-storage" }
flowlens-tls = { path = "../flowlens-tls" }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"

[[bin]]
name = "flowlens-service"
path = "src/main.rs"