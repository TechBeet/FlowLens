[package]
name = "flowlens-mcp"
version = "0.1.0"
edition = "2021"
description = "MCP (Model Context Protocol) server for FlowLens"
license = "MIT"

[dependencies]
flowlens-core = { path = "../flowlens-core" }
flowlens-storage = { path = "../flowlens-storage" }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
thiserror = "1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"