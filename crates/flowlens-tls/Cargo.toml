[package]
name = "flowlens-tls"
version = "0.1.0"
edition = "2021"
description = "TLS MITM, certificate management, and decryption for FlowLens"
license = "MIT"

[dependencies]
flowlens-core = { path = "../flowlens-core" }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
thiserror = "1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
rcgen = { version = "0.13", features = ["pem", "x509-parser"] }
chrono = { version = "0.4.45", features = ["serde"] }
sha2 = "0.10"
rayon = "1.8"