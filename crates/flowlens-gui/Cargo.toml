[package]
name = "flowlens-gui"
version = "0.1.0"
edition = "2021"
description = "FlowLens native GUI frontend (eframe/egui)"
license = "MIT"

[dependencies]
eframe = "0.29"
egui = "0.29"
flowlens-core = { path = "../flowlens-core" }
flowlens-ui = { path = "../flowlens-ui" }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
thiserror = "1"