[package]
name = "flowlens-storage"
version = "0.1.0"
edition = "2021"
description = "SQLite storage engine for FlowLens"
license = "MIT"

[dependencies]
flowlens-core = { path = "../flowlens-core" }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
thiserror = "1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", features = ["sqlite", "runtime-tokio"] }

[dev-dependencies]
tempdir = "0.3"