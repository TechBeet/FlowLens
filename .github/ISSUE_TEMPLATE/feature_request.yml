name: ⭐ Feature Request
description: Suggest a new feature or improvement
labels: [enhancement, triage]
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-flight Checks
      description: Please verify these before submitting
      options:
        - label: I have searched existing issues for duplicates
          required: true
        - label: This feature is not already implemented
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem would this feature solve?
      placeholder: |
        Currently, I cannot...
        This is inconvenient because...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How do you envision this feature working?
      placeholder: |
        FlowLens could add...
        The user would be able to...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What other solutions have you considered?
      render: markdown
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: Impact
      description: How important is this feature to you?
      options:
        - Critical (I cannot use FlowLens without it)
        - High (Major workflow improvement)
        - Medium (Nice to have)
        - Low (Minor improvement)
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Screenshots, mockups, or other relevant information
      render: markdown
    validations:
      required: false