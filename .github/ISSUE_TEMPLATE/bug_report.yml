name: 🐛 Bug Report
description: Report a reproducible bug in FlowLens
labels: [bug, triage]
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-flight Checks
      description: Please verify these before submitting
      options:
        - label: I am using the latest version
          required: true
        - label: I have searched existing issues for duplicates
          required: true
        - label: This is not a feature request or question
          required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Clear and concise description of the bug
      placeholder: |
        FlowLens crashes when...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: FlowLens Version
      description: Output of `flowlens --version`
      placeholder: "0.1.0"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows 10/11 x64
        - Windows ARM64
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux x86_64 (GNU)
        - Linux x86_64 (MUSL)
        - Linux ARM64
        - Other
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Minimal steps to reproduce the issue
      placeholder: |
        1. Start FlowLens with `flowlens.exe --capture`
        2. Visit https://example.com
        3. Observe crash
      render: markdown
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should happen instead?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened? Include error messages, stack traces, etc.
      render: markdown
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / Output
      description: Relevant log output (use RUST_BACKTRACE=1 for more detail)
      render: shell
      placeholder: |
        thread 'main' panicked at '...'
    validations:
      required: false

  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: Relevant config (Npcap mode, WFP driver, etc.)
      render: markdown
      placeholder: |
        - Capture mode: WFP
        - TLS decryption: enabled
        - Npcap version: 1.75
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other information, screenshots, or context
      render: markdown
    validations:
      required: false