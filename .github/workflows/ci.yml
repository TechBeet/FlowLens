name: CI - Hardened FlowLens Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least-privilege by default; any job needing write access opts in explicitly.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Cancel superseded runs for the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Rust: format check
  # ---------------------------------------------------------------------------
  rust-fmt:
    name: rustfmt --check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust stable (rustfmt only)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

  # ---------------------------------------------------------------------------
  # Rust: clippy (workspace, all targets, warnings denied)
  # ---------------------------------------------------------------------------
  rust-clippy:
    name: clippy --workspace --all-targets (-D warnings)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [rust-fmt]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux build deps for Tauri + pcap (flowlens-capture)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libssl-dev pkg-config libpcap-dev

      - name: Install Rust stable (clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # ---------------------------------------------------------------------------
  # Rust: tests (ubuntu-latest)
  # ---------------------------------------------------------------------------
  rust-test:
    name: cargo test --workspace
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [rust-clippy]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux build deps for Tauri + pcap
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libssl-dev pkg-config libpcap-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Assert wpdlib link args are Windows-only
        run: |
          # crates/flowlens-capture/build.rs vendors the Npcap import libraries
          # from wpdlib/. It must bail out before emitting any linker args on
          # non-Windows targets, otherwise Linux builds/tests break.
          set -euo pipefail
          build_rs="crates/flowlens-capture/build.rs"
          test -f "$build_rs"
          grep -q 'CARGO_CFG_TARGET_OS' "$build_rs"
          grep -q 'target_os != "windows"' "$build_rs"
          grep -q 'return;' "$build_rs"
          echo "OK: $build_rs gates linker args behind a windows target check"

      - name: Run Rust tests
        run: cargo test --workspace
  # ---------------------------------------------------------------------------
  # UI: typecheck + Vite build + Vitest unit tests
  # ---------------------------------------------------------------------------
  ui-check:
    name: UI check (tsc/build/vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [rust-test]
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node (cache npm)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: npm ci
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Build (Vite)
        run: npm run build

      - name: Unit tests (Vitest)
        run: npx vitest run

      - name: Upload UI dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: flowlens-ui-dist
          path: ui/dist
          retention-days: 7

  # ---------------------------------------------------------------------------
  # UI: Playwright end-to-end tests (only when ui/e2e exists)
  # Depends on ui-check so the app already typechecks, builds and tests green.
  # ---------------------------------------------------------------------------
  ui-e2e:
    name: UI e2e (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [ui-check]
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect ui/e2e directory
        id: detect
        shell: bash
        run: |
          if [ -d ui/e2e ]; then echo "has_e2e=true" >> "$GITHUB_OUTPUT"; else echo "has_e2e=false" >> "$GITHUB_OUTPUT"; fi

      - name: Setup Node (cache npm)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: npm ci
        run: npm ci

      - name: Install Playwright Chromium (with system deps)
        if: steps.detect.outputs.has_e2e == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        if: steps.detect.outputs.has_e2e == 'true'
        run: npx playwright test

      - name: Report no e2e directory
        if: steps.detect.outputs.has_e2e == 'false'
        run: echo "No ui/e2e directory found; skipping end-to-end tests."

  # ---------------------------------------------------------------------------
  # Docs: relative-link integrity under docs/
  # ---------------------------------------------------------------------------
  docs-links:
    name: docs link integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [rust-test]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check docs links
        run: python scripts/check_docs_links.py .

  # ---------------------------------------------------------------------------
  # Publish: consolidated UI dist artifact once downstream jobs pass.
  # ---------------------------------------------------------------------------
  publish-dist:
    name: publish UI dist artifact
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [rust-test, ui-check, ui-e2e, docs-links]
    if: ${{ always() && success() }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: flowlens-ui-dist
          path: dist

      - name: Upload consolidated UI dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: flowlens-ui-dist-consolidated
          path: dist
          retention-days: 7