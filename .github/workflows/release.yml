name: Create Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write
  id-token: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-release:
    name: Build & Package Release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: Windows (x64)
            target: x86_64-pc-windows-msvc
            artifact: flowlens-windows.zip
            runner: windows-latest
          - name: macOS (Apple Silicon)
            target: aarch64-apple-darwin
            artifact: flowlens-macos-arm64.tar.gz
            runner: macos-latest
          - name: macOS (Intel)
            target: x86_64-apple-darwin
            artifact: flowlens-macos-intel.tar.gz
            runner: macos-latest
          - name: Linux (x64 GNU)
            target: x86_64-unknown-linux-gnu
            artifact: flowlens-linux-x64-gnu.tar.gz
            runner: ubuntu-latest
          - name: Linux (x64 MUSL)
            target: x86_64-unknown-linux-musl
            artifact: flowlens-linux-x64-musl.tar.gz
            runner: ubuntu-latest

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.cargo/registry/src/
            target/
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target }}-
            ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          mkdir -p dist
          cd target/${{ matrix.target }}/release
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            zip /github/workspace/dist/${{ matrix.artifact }} flowlens.exe
          else
            tar -czf /github/workspace/dist/${{ matrix.artifact }} flowlens
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/${{ matrix.artifact }}
          retention-days: 7

  create-release:
    name: Create Release
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            ## ${{ github.ref_name }}

            Auto-generated release from CI. Check individual artifacts for platform-specific builds.
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          files: |
            dist/*.zip
            dist/*.tar.gz